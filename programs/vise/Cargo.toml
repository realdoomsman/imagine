[package]
name = "vise"
version = "0.1.0"
description = "VISE — time-weighted lock-to-earn vaults for pump.fun coins"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vise"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = { version = "0.31.0", features = ["token_2022"] }
