[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size-optimised: the deployed program account has a fixed length, and rent
# scales with it.
opt-level = "z"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
